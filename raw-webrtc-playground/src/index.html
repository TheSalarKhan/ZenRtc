<!DOCTYPE html>
<html lang="en">
<head>

  <title>Raw WebRTC Playground</title>
</head>
<body>
  <div style="display: flex; flex-direction: row; gap: 16px;">

      <div id="status1">pc1: idle</div>

      <div id="status2">pc2: idle</div>
      <video id="remoteVideo2" style="object-fit: contain;" autoplay muted playsinline></video>
    </div>
  </div>
